<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Offline · ClassHub</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f8fafc; color: #334155; }
      .card { text-align: center; padding: 32px; max-width: 360px; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 20px; color: #0f172a; margin: 20px 0 8px; }
      p { font-size: 14px; line-height: 1.6; margin: 0 0 20px; color: #64748b; }
      button { background: linear-gradient(#10b981, #059669); color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.svg" alt="" />
      <h1>You're offline</h1>
      <p>ClassHub needs an internet connection to load your classes. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
